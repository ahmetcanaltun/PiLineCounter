<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval Monitor - Traffic Counter</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: #888899;
            --accent-cyan: #00d4ff;
            --accent-green: #00ff88;
            --accent-red: #ff4466;
            --accent-purple: #aa66ff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(170, 102, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app { position: relative; z-index: 1; }

        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-cyan);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent-green);
        }

        .pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* Summary cards */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .sum-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.1rem 1.4rem;
            backdrop-filter: blur(10px);
        }

        .sum-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .sum-value {
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .sum-value.green { color: var(--accent-green); }
        .sum-value.red   { color: var(--accent-red); }
        .sum-value.cyan  { color: var(--accent-cyan); }

        /* Feed */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .feed-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .interval-badge {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 0.2rem 0.6rem;
        }

        #feed {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .record {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.85rem 1.1rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .record.new {
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.05);
        }

        .rec-time  { color: var(--text-secondary); white-space: nowrap; flex: 0 0 auto; }
        .rec-in    { color: var(--accent-green); font-weight: 600; white-space: nowrap; }
        .rec-out   { color: var(--accent-red); font-weight: 600; white-space: nowrap; }
        .rec-raw   { color: var(--text-secondary); font-size: 0.75rem; margin-left: auto; opacity: 0.5; }

        @media (max-width: 600px) {
            .summary { grid-template-columns: 1fr 1fr; }
            .summary .sum-card:last-child { grid-column: span 2; }
            .container { padding: 1rem; }
            .rec-raw { display: none; }
            .header { padding: 0.5rem 1rem; }
            .header h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="app">
        <header class="header">
            <h1>📊 Interval Monitor</h1>
            <div class="header-right">
                <div class="live-badge"><div class="pulse"></div> CANLI</div>
                <a href="/" class="back-btn">← Dashboard</a>
            </div>
        </header>

        <div class="container">
            <div class="summary">
                <div class="sum-card">
                    <div class="sum-label">Toplam Giriş</div>
                    <div class="sum-value green" id="totalIn">0</div>
                </div>
                <div class="sum-card">
                    <div class="sum-label">Toplam Çıkış</div>
                    <div class="sum-value red" id="totalOut">0</div>
                </div>
                <div class="sum-card">
                    <div class="sum-label">Kayıt Sayısı</div>
                    <div class="sum-value cyan" id="recCount">0</div>
                </div>
            </div>

            <div class="feed-header">
                <div class="feed-title">Son Kayıtlar</div>
                <div class="interval-badge" id="intervalBadge">5 saniyelik aralık</div>
            </div>

            <div id="feed"></div>
        </div>
    </div>

    <script>
        let lastCount = 0;
        let totalIn = 0, totalOut = 0;
        const feed = document.getElementById('feed');

        async function poll() {
            try {
                const res = await fetch('/api/records');
                const records = await res.json();

                if (records.length > lastCount) {
                    const newRecords = records.slice(lastCount);
                    newRecords.reverse().forEach(r => addRecord(r, true));
                    lastCount = records.length;
                }
            } catch (e) {}
        }

        function addRecord(r, isNew = false) {
            totalIn  += r.in  || 0;
            totalOut += r.out || 0;

            document.getElementById('totalIn').textContent  = totalIn;
            document.getElementById('totalOut').textContent = totalOut;
            document.getElementById('recCount').textContent = lastCount;

            const fromTime = r.from ? r.from.slice(11, 19) : '';
            const toTime   = r.to   ? r.to.slice(11, 19)   : '';

            const div = document.createElement('div');
            div.className = 'record' + (isNew ? ' new' : '');
            div.innerHTML = `
                <span class="rec-time">${fromTime} → ${toTime}</span>
                <span class="rec-in">↓ GİRİŞ: ${r.in || 0}</span>
                <span class="rec-out">↑ ÇIKIŞ: ${r.out || 0}</span>
                <span class="rec-raw">${JSON.stringify(r)}</span>
            `;

            feed.insertBefore(div, feed.firstChild);

            while (feed.children.length > 50) feed.removeChild(feed.lastChild);

            if (isNew) setTimeout(() => div.classList.remove('new'), 1500);
        }

        setInterval(poll, 1000);
        poll();
    </script>
</body>
</html>

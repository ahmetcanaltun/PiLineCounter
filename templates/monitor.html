<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSON Monitor</title>
    <style>
        body { font-family: monospace; background: #fff; color: #000; padding: 1rem; }
        pre { border-bottom: 1px solid #ccc; margin: 0; padding: 0.25rem 0; }
    </style>
</head>
<body>
    <div id="feed"></div>
    <script>
        let lastCount = 0;

        async function poll() {
            try {
                const res = await fetch('/api/records');
                const records = await res.json();
                if (records.length > lastCount) {
                    const feed = document.getElementById('feed');
                    const newRecords = records.slice(lastCount);
                    newRecords.reverse().forEach(r => {
                        const pre = document.createElement('pre');
                        pre.textContent = JSON.stringify(r);
                        feed.insertBefore(pre, feed.firstChild);
                    });
                    lastCount = records.length;
                }
            } catch (e) {}
        }

        setInterval(poll, 1000);
        poll();
    </script>
</body>
</html>

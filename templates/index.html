<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Counter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .logo h1 {
            font-size: 1.3rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #888;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .nav-link {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-link:hover {
            background: rgba(0,217,255,0.2);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 1.5rem;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .video-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            position: relative;
        }
        .video-container img {
            width: 100%;
            display: block;
        }
        .video-overlay {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #00ff88;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.25rem;
        }
        .card-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            margin-bottom: 0.75rem;
        }
        .counter-card {
            text-align: center;
        }
        .counter-value {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
        }
        .counter-label {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.25rem;
        }
        .counter-card.in .counter-value {
            color: #00ff88;
        }
        .counter-card.out .counter-value {
            color: #ff6b6b;
        }
        .occupancy-card {
            background: linear-gradient(135deg, rgba(0,217,255,0.1), rgba(0,255,136,0.1));
            border-color: rgba(0,217,255,0.3);
        }
        .occupancy-value {
            font-size: 3.5rem;
            font-weight: 700;
            text-align: center;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .occupancy-label {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }
        .counter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #666;
            font-size: 0.85rem;
        }
        .info-value {
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .mode-badge {
            background: rgba(0,217,255,0.2);
            color: #00d9ff;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .btn {
            width: 100%;
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.3);
            padding: 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(255,107,107,0.3);
        }
        .time-display {
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">📷</div>
            <h1>Traffic Counter</h1>
        </div>
        <div class="header-right">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Live</span>
            </div>
            <span class="time-display" id="clock"></span>
            <a href="/config" class="nav-link">⚙️ Settings</a>
        </div>
    </div>

    <div class="container">
        <div class="main-grid">
            <div class="video-container">
                <img src="/video_feed" alt="Live Stream">
            </div>

            <div class="sidebar">
                <div class="card occupancy-card">
                    <div class="card-header">Current Occupancy</div>
                    <div class="occupancy-value" id="occupancy">0</div>
                    <div class="occupancy-label">people inside</div>
                </div>

                <div class="counter-row">
                    <div class="card counter-card in">
                        <div class="counter-value" id="count-in">0</div>
                        <div class="counter-label">Entered</div>
                    </div>
                    <div class="card counter-card out">
                        <div class="counter-value" id="count-out">0</div>
                        <div class="counter-label">Exited</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">Status</div>
                    <div class="info-row">
                        <span class="info-label">Mode</span>
                        <span class="mode-badge" id="mode">PERSON</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Direction</span>
                        <span class="info-value" id="direction">Normal</span>
                    </div>
                </div>

                <button class="btn" onclick="resetCounters()">Reset Counters</button>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        async function fetchData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                const countIn = data.counts.in;
                const countOut = data.counts.out;

                document.getElementById('count-in').textContent = countIn;
                document.getElementById('count-out').textContent = countOut;
                document.getElementById('occupancy').textContent = Math.max(0, countIn - countOut);
                document.getElementById('mode').textContent = data.mode.toUpperCase();
                document.getElementById('direction').textContent = data.flip_direction ? 'Flipped' : 'Normal';
            } catch (e) {
                console.error('Failed to fetch data:', e);
            }
        }

        async function resetCounters() {
            if (!confirm('Reset all counters to zero?')) return;
            try {
                await fetch('/api/reset', { method: 'POST' });
                fetchData();
            } catch (e) {
                console.error('Failed to reset:', e);
            }
        }

        updateClock();
        setInterval(updateClock, 1000);
        fetchData();
        setInterval(fetchData, 1000);
    </script>
</body>
</html>

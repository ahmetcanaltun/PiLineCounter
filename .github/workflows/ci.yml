name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # matches Raspberry Pi OS Bookworm
          cache: pip

      # The camera stack is stubbed in tests/conftest.py, so OpenCV,
      # ultralytics and picamera2 are not needed here.
      - run: pip install flask pytest ruff
      - run: ruff check .
      - run: pytest -q
